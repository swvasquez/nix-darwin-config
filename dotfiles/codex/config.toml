# System-wide Codex defaults, at /etc/codex/config.toml on the host. The
# sandbox has its own copy, .sbx/kit/codex-config.toml, which adds the proxy
# login; keep the two in step. Mirrors the env block of Claude Code's managed settings,
# which turns off telemetry, error reporting and feedback. This is Codex's
# lowest-priority config layer, so ~/.codex/config.toml can override it.

# Updates come from Homebrew on the host and the pinned kit in the sandbox.
check_for_update_on_startup = false

# Auto-review, the only mode requirements.toml allows on either side. Set here
# so Codex picks it directly rather than by falling back.
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[analytics]
enabled = false

[feedback]
enabled = false

[otel]
exporter = "none"

# Mirrors the GIT_ variables in Claude's managed env. Git skips the optional
# index refresh, since .git is read-only to agents. attr.tree is the empty
# tree, so git ignores .gitattributes and never needs the git-crypt key,
# which agents can't read. Every remote transport is refused.
[shell_environment_policy.set]
GIT_OPTIONAL_LOCKS = "0"
GIT_CONFIG_COUNT = "2"
GIT_CONFIG_KEY_0 = "attr.tree"
GIT_CONFIG_VALUE_0 = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"
GIT_CONFIG_KEY_1 = "protocol.allow"
GIT_CONFIG_VALUE_1 = "never"
