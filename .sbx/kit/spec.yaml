# Kit for running Claude Code against this repo in a Docker Sandboxes microVM.
# Linux guest: can edit/review but not run darwin-rebuild - that stays on the
# host via `just build`.

# Must be "2": v1's grammar has no `permissions`/`setup` and fails to load.
schemaVersion: "2"
kind: mixin
name: nix-darwin-config

# Open egress for web search/docs. LAN is blocked via --deny-network flags in
# `just sbx-up`, not here - a kit declares CIDR rules without enforcing them.
permissions:
  network:
    allow:
      - "**"

# git-crypt encrypts config/** and versions.csv, but this sandbox has no
# git-crypt binary (and shouldn't hold the key). These override its filters to
# `cat` so reads (git diff/show/log -p) don't crash on a missing binary -
# seeing ciphertext is fine, that's all the sandbox should see anyway. Set as
# env vars, not .git/config, because env vars outrank config files and
# .git/config is shared with the host.
environment:
  variables:
    GIT_CONFIG_COUNT: "4"
    GIT_CONFIG_KEY_0: filter.git-crypt.clean
    GIT_CONFIG_VALUE_0: cat
    GIT_CONFIG_KEY_1: filter.git-crypt.smudge
    GIT_CONFIG_VALUE_1: cat
    GIT_CONFIG_KEY_2: diff.git-crypt.textconv
    GIT_CONFIG_VALUE_2: cat
    # This one blocks writes rather than passing reads through - see the hook below.
    GIT_CONFIG_KEY_3: core.hooksPath
    GIT_CONFIG_VALUE_3: /etc/git/hooks

setup:
  # Toolchain (nixfmt, shfmt, shellcheck, markdownlint, sponge, jq, prek,
  # gitleaks, just) is pinned to this repo's own nixpkgs revision, not apt/npm, so
  # `just format`/`just check` match the host exactly. Runs once at creation;
  # `just sbx-up` re-syncs it after `just update` changes flake.lock.
  install:
    # Single-user Nix, no daemon: a microVM has no init to run nix-daemon under.
    - command: |
        set -eu
        apt-get update
        apt-get install -y --no-install-recommends xz-utils
        install -d -m 0755 -o agent -g agent /nix
        mkdir -p /etc/nix
        printf '%s\n' 'experimental-features = nix-command flakes' \
          'build-users-group =' > /etc/nix/nix.conf
      description: Install Nix's prerequisites and give the agent the store
    # Revision comes from flake.lock, so this is the host's exact nixpkgs pin.
    - command: |
        set -eu
        export HOME=/home/agent USER=agent
        installer=$(mktemp)
        curl -sSfL -o "$installer" https://nixos.org/nix/install
        sh "$installer" --no-daemon --no-channel-add --no-modify-profile --yes
        rm -f "$installer"
        rev=$(jq -r '.nodes.nixpkgs.locked.rev // empty' "$WORKSPACE_DIR/flake.lock" 2>/dev/null) || rev=
        if [ -z "$rev" ]; then
          echo 'warning: no nixpkgs rev in flake.lock; falling back to nixpkgs-25.11-darwin' >&2
        fi
        nixpkgs="github:NixOS/nixpkgs/${rev:-nixpkgs-25.11-darwin}"
        "$HOME/.nix-profile/bin/nix" profile install \
          "$nixpkgs#gitleaks" \
          "$nixpkgs#jq" \
          "$nixpkgs#just" \
          "$nixpkgs#markdownlint-cli" \
          "$nixpkgs#moreutils" \
          "$nixpkgs#nixfmt-rfc-style" \
          "$nixpkgs#prek" \
          "$nixpkgs#shellcheck" \
          "$nixpkgs#shfmt"
      user: "1000"
      description: Install Nix and the toolchain the justfile drives
    # Symlinked rather than added to PATH, so re-sourcing sandbox-persistent.sh
    # on every command doesn't grow PATH a copy at a time.
    - command: |
        set -eu
        for tool in nix nixfmt shfmt shellcheck markdownlint sponge jq prek gitleaks just; do
          src="/home/agent/.nix-profile/bin/$tool"
          [ -x "$src" ] || { echo "error: $src missing or not executable" >&2; exit 1; }
          ln -sfn "$src" "/usr/local/bin/$tool"
        done
      description: Put the toolchain on PATH for every user and shell
    # Blocks commits touching git-crypt-encrypted paths: the read-through
    # filters above can't encrypt on write, so that has to happen on the host.
    - command: |
        set -eu
        mkdir -p /etc/git/hooks
        cat > /etc/git/hooks/pre-commit <<'HOOK'
        #!/bin/sh
        # git-crypt encrypts these paths but this sandbox can't - block plaintext commits.
        # Fail closed: any error here must block the commit, not let it through.
        set -eu
        staged=$(git diff --cached --name-only --diff-filter=ACMR)
        [ -n "$staged" ] || exit 0
        encrypted=$(printf '%s\n' "$staged" |
          git check-attr --stdin filter |
          sed -n 's/: filter: git-crypt$//p')
        [ -n "$encrypted" ] || exit 0
        printf 'git-crypt encrypts these paths and this sandbox cannot:\n' >&2
        printf '%s\n' "$encrypted" >&2
        printf 'Commit them from the host, which holds the key.\n' >&2
        exit 1
        HOOK
        chmod 0755 /etc/git/hooks/pre-commit
      description: Refuse commits of the paths git-crypt encrypts
    # This sandbox has no working push credential anyway, but a Claude Code
    # permission rule only inspects the literal command text, so it can't
    # stop `git push` run indirectly (e.g. from inside a script). A git-level
    # hook catches the operation itself, however it was invoked.
    - command: |
        set -eu
        cat > /etc/git/hooks/pre-push <<'HOOK'
        #!/bin/sh
        printf 'This sandbox cannot push - do it from the host, which holds the real credentials.\n' >&2
        exit 1
        HOOK
        chmod 0755 /etc/git/hooks/pre-push
      description: Refuse all pushes from the sandbox
    # Agent's home isn't host-mounted, so a recreate would revert an update
    # made at startup - do it here instead.
    - command: claude update
      user: "1000"
  startup:
    # Workspace is bind-mounted, so this directory persists across recreates -
    # session history and the stored login survive a rebuild.
    - command:
        - sh
        - -c
        - >-
          mkdir -p "$WORKSPACE_DIR/.sbx/claude" &&
          chown agent:agent "$WORKSPACE_DIR/.sbx/claude" &&
          echo "export CLAUDE_CONFIG_DIR=\"$WORKSPACE_DIR/.sbx/claude\""
          > /etc/sandbox-persistent.sh
      user: "0"
    # Preserves the login seed sbx placed before CLAUDE_CONFIG_DIR (above) hides it.
    - command:
        - sh
        - -c
        - >-
          ln -sfn /home/agent/.claude/.credentials.json
          "$WORKSPACE_DIR/.sbx/claude/.credentials.json" &&
          chown -h agent:agent "$WORKSPACE_DIR/.sbx/claude/.credentials.json"
      user: "0"
    # Linked, not copied, so edits to settings.json take effect next launch.
    # This tier is authoritative: unlike .sbx/claude/settings.json, Claude Code
    # can't override it via /config.
    - command:
        - sh
        - -c
        - >-
          mkdir -p /etc/claude-code &&
          ln -sfn "$WORKSPACE_DIR/.sbx/kit/settings.json"
          /etc/claude-code/managed-settings.json
      user: "0"
