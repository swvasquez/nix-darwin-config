# syntax=docker/sandbox-kit:3
# Kit for running Claude Code and Codex against this repo in a Docker Sandboxes
# microVM. Linux guest: can edit/review but not run darwin-rebuild - that stays
# on the host via `just build`.
#
# A mixin on the `shell` workload, beside Docker's sbx/claude-mixin and
# sbx/codex-mixin (see `just sbx-up`). Those install both agents and wire their
# logins through the proxy, so this kit only adds what is specific to this repo.
# Declaration-only: no recipe, so no <stem>.dockerfile beside it.
schemaVersion: "3"
kind: mixin
displayName: nix-darwin-config
description: Toolchain, git-crypt guards and Claude Code and Codex settings for this repo.

# The agents' config dirs and rules below have nothing to act on without
# them. The hooks use apt-get and jq from the shell base.
requires: ["claude", "codex", "deb/apt", "deb/jq"]

capabilities:
  # Open egress for web search/docs, and for the Nix install at create. LAN is
  # blocked via --deny-network flags in `just sbx-up`, not here - a kit
  # declares CIDR rules without enforcing them.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow: ["**"]
      runtime:
        allow: ["**"]

  - type: com.docker.sandbox/lifecycle@1
    config:
      # Toolchain (git, nixfmt, shfmt, shellcheck, markdownlint, sponge, jq,
      # prek, gitleaks, just) is pinned to this repo's own nixpkgs revision, not
      # apt/npm, so `just format`/`just check` match the host exactly. Runs once
      # at creation; `just sbx-up` re-syncs it after `just update` changes
      # flake.lock.
      install:
        # Single-user Nix, no daemon: a microVM has no init to run nix-daemon under.
        - command: |
            set -eu
            apt-get update
            apt-get install -y --no-install-recommends xz-utils mount
            install -d -m 0755 -o agent -g agent /nix
            mkdir -p /etc/nix
            printf '%s\n' 'experimental-features = nix-command flakes' \
              'build-users-group =' > /etc/nix/nix.conf
          user: "0"
          env: [HTTP_PROXY, HTTPS_PROXY, http_proxy, https_proxy]
          description: Install Nix's and the covers' prerequisites and give the agent the store
        # Revision comes from flake.lock, so this is the host's exact nixpkgs pin.
        - command: |
            set -eu
            export HOME=/home/agent USER=agent
            installer=$(mktemp)
            curl -sSfL -o "$installer" https://nixos.org/nix/install
            sh "$installer" --no-daemon --no-channel-add --no-modify-profile --yes
            rm -f "$installer"
            rev=$(jq -r '.nodes.nixpkgs.locked.rev // empty' "$WORKSPACE_DIR/flake.lock" 2>/dev/null) || rev=
            if [ -z "$rev" ]; then
              echo 'warning: no nixpkgs rev in flake.lock; falling back to nixpkgs-26.05-darwin' >&2
            fi
            nixpkgs="github:NixOS/nixpkgs/${rev:-nixpkgs-26.05-darwin}"
            "$HOME/.nix-profile/bin/nix" profile install \
              "$nixpkgs#git" \
              "$nixpkgs#gitleaks" \
              "$nixpkgs#jq" \
              "$nixpkgs#just" \
              "$nixpkgs#markdownlint-cli" \
              "$nixpkgs#moreutils" \
              "$nixpkgs#nixfmt" \
              "$nixpkgs#prek" \
              "$nixpkgs#shellcheck" \
              "$nixpkgs#shfmt"
          user: "1000"
          env: [WORKSPACE_DIR, HTTP_PROXY, HTTPS_PROXY, http_proxy, https_proxy]
          description: Install Nix and the toolchain the justfile drives
        # Symlinked rather than added to PATH, so every user and shell gets the
        # same tools without editing anyone's profile.
        - command: |
            set -eu
            for tool in nix git nixfmt shfmt shellcheck markdownlint sponge jq prek gitleaks just; do
              src="/home/agent/.nix-profile/bin/$tool"
              [ -x "$src" ] || { echo "error: $src missing or not executable" >&2; exit 1; }
              ln -sfn "$src" "/usr/local/bin/$tool"
            done
          user: "0"
          description: Put the toolchain on PATH for every user and shell
        # The sandbox's only git config; an agent env that set GIT_CONFIG_COUNT
        # would replace it. attr.tree is the empty tree
        # (`git hash-object -t tree /dev/null`), so git ignores .gitattributes
        # and never runs git-crypt. git comes from nixpkgs with the rest of the
        # toolchain, so it matches the host's version.
        # The rest: hooks from /etc/git/hooks, no remote transports, no tokens
        # in URLs. Env vars, because they outrank .git/config, which is shared
        # with the host. v3 has no environment block, so login shells read
        # them from profile.d.
        - command: |
            set -eu
            cat > /etc/profile.d/nix-darwin-config-git.sh <<'EOF'
            export GIT_CONFIG_COUNT=4
            export GIT_CONFIG_KEY_0=attr.tree
            export GIT_CONFIG_VALUE_0=4b825dc642cb6eb9a060e54bf8d69288fbee4904
            export GIT_CONFIG_KEY_1=core.hooksPath
            export GIT_CONFIG_VALUE_1=/etc/git/hooks
            export GIT_CONFIG_KEY_2=protocol.allow
            export GIT_CONFIG_VALUE_2=never
            export GIT_CONFIG_KEY_3=transfer.credentialsInUrl
            export GIT_CONFIG_VALUE_3=die
            EOF
            chmod 0644 /etc/profile.d/nix-darwin-config-git.sh
          user: "0"
          description: Hide git-crypt from git and set the sandbox's git config
        # sbx starts the sandbox even when a startup step fails. Without the
        # startup step's marker, git-crypt's plain-text files may be exposed,
        # so every login shell exits here, and with it any agent it would
        # start. Named 00- so it runs before the other profile.d scripts. A
        # non-login `sbx exec` still works for reading the startup log.
        - command: |
            set -eu
            cat > /etc/profile.d/00-nix-darwin-config-guard.sh <<'EOF'
            [ -e /run/nix-darwin-config-covered-ok ] ||
              { echo 'kit.yaml: stub covers failed, see /var/log/sbx-kit-startup.log' >&2; exit 1; }
            EOF
            chmod 0644 /etc/profile.d/00-nix-darwin-config-guard.sh
          user: "0"
          description: Refuse login shells unless the stub covers are on
        # This sandbox has no working push credential anyway, but an agent
        # permission rule only inspects the literal command text, so it can't
        # stop `git push` run indirectly (e.g. from inside a script). A git-level
        # hook catches the operation itself, however it was invoked.
        - command: |
            set -eu
            mkdir -p /etc/git/hooks
            cat > /etc/git/hooks/pre-push <<'HOOK'
            #!/bin/sh
            printf 'This sandbox cannot push - do it from the host, which holds the real credentials.\n' >&2
            exit 1
            HOOK
            chmod 0755 /etc/git/hooks/pre-push
          user: "0"
          description: Refuse all pushes from the sandbox
        # The agents' rules: Claude Code's managed settings, and Codex's
        # requirements, defaults and PreToolUse hook. Copied root-owned into
        # the VM's own /etc, not linked to the workspace, which both agents and
        # anything on the host can write. Repo edits take effect at the next
        # `just sbx-up`. Neither agent can override this tier from its own
        # settings.
        - command: |
            set -eu
            kit="$WORKSPACE_DIR/.sbx/kit"
            install -D -o root -g root -m 0644 "$kit/managed-settings.json" /etc/claude-code/managed-settings.json
            install -D -o root -g root -m 0644 "$kit/codex-requirements.toml" /etc/codex/requirements.toml
            install -D -o root -g root -m 0644 "$kit/codex-config.toml" /etc/codex/config.toml
            install -D -o root -g root -m 0644 "$kit/codex-deny-paths.sh" /etc/codex/hooks/deny-paths.sh
          user: "0"
          env: [WORKSPACE_DIR]
          description: Install the agents' rule files, root-owned
      startup:
        # Locks the sandbox down on every start, inside the VM only; the
        # host's files are untouched. In order:
        # - The agent stops being root. The base image gives it passwordless
        #   sudo, and the docker group, which is root through the socket. sbx
        #   adds that group to every command regardless of /etc/group, so the
        #   socket is made root-only instead. Then it checks the result as
        #   the agent, so a new route to root in a later sbx stops the start
        #   rather than going unnoticed.
        # - .git is mounted read-only over itself, so no git write works,
        #   however it's run. This goes first: mounts under .git made before
        #   it wouldn't carry over. The files the host runs or loads without
        #   a review step are read-only too: the kit and .gitattributes
        #   (the next start's rules), the commit hooks, Claude's project
        #   settings, and the justfile and scripts `just build` runs. Edit
        #   them from the host.
        # - An empty folder covers the git-crypt key.
        # - Each git-crypt pattern in .gitattributes gets the matching stub
        #   from .sbx/kit/stubs, read-only. A `dir/**` pattern covers the
        #   whole folder, so files the host adds later stay hidden too. A
        #   pattern with no stub, such as `*.key`, makes mount fail.
        # sbx starts the sandbox even when a startup step fails. So if any
        # of this fails, the trap covers the whole workspace with an empty
        # folder, which holds for every process, login shell or not. The
        # marker is written only once all of it worked; the guard above
        # tells login shells why the workspace is empty.
        - command: |
            set -euf
            ws="$WORKSPACE_DIR"
            rm -f /run/nix-darwin-config-covered-ok
            trap '[ -e /run/nix-darwin-config-covered-ok ] || mount -t tmpfs -o ro tmpfs "$ws"' EXIT
            rm -f /etc/sudoers.d/agent
            chown root:root /var/run/docker.sock
            chmod 0600 /var/run/docker.sock
            command -v runuser >/dev/null
            if runuser -u agent -- sudo -n true 2>/dev/null; then echo 'kit.yaml: agent still has sudo' >&2; exit 1; fi
            if runuser -u agent -- docker info >/dev/null 2>&1; then echo 'kit.yaml: agent still has docker' >&2; exit 1; fi
            mount --bind -o ro "$ws/.git" "$ws/.git"
            for f in .sbx/kit .gitattributes .pre-commit-config.yaml .claude justfile scripts; do
              mount --bind -o ro "$ws/$f" "$ws/$f"
            done
            if [ -d "$ws/.git/git-crypt" ]; then
              mount -t tmpfs -o ro,size=4k tmpfs "$ws/.git/git-crypt"
            fi
            patterns=$(sed -n 's/^\([^#[:space:]]*\).*filter=git-crypt.*/\1/p' "$ws/.gitattributes" 2>/dev/null) || true
            for p in $patterns; do
              path=${p%/\*\*}
              mount --bind -o ro "$ws/.sbx/kit/stubs/$path" "$ws/$path"
            done
            : > /run/nix-darwin-config-covered-ok
          user: "0"
          env: [WORKSPACE_DIR]
          description: Cover git-crypt's plain-text files with stubs and hide its key
        # Workspace is bind-mounted, so this directory persists across
        # recreates - session history and the stored login survive a rebuild.
        - command:
            - sh
            - -c
            - >-
              mkdir -p "$WORKSPACE_DIR/.sbx/claude" &&
              chown agent:agent "$WORKSPACE_DIR/.sbx/claude" &&
              echo "export CLAUDE_CONFIG_DIR=\"$WORKSPACE_DIR/.sbx/claude\""
              > /etc/profile.d/nix-darwin-config-claude.sh
          user: "0"
          env: [WORKSPACE_DIR]
          description: Keep Claude's config dir in the workspace
        # Same for Codex: its config, history and sessions (`codex resume`)
        # survive a rebuild. Set from profile.d, like CLAUDE_CONFIG_DIR, so it
        # doesn't clash with the CODEX_HOME sbx/codex-mixin sets in the image.
        # Like Claude's settings.json, Codex's config.toml is its own file
        # here; the one that kit rewrites in the VM's home on every create is
        # not read, and its needed settings are in codex-config.toml instead.
        - command:
            - sh
            - -c
            - >-
              d="$WORKSPACE_DIR/.sbx/codex" &&
              mkdir -p "$d" &&
              chown agent:agent "$d" &&
              echo "export CODEX_HOME=\"$d\""
              > /etc/profile.d/nix-darwin-config-codex.sh &&
              if [ -L "$d/config.toml" ]; then rm -f "$d/config.toml"; fi
          user: "0"
          env: [WORKSPACE_DIR]
          description: Keep Codex's home in the workspace
        # Both agents always use the proxy's login, so the real tokens stay on
        # the host and the sandbox only holds sentinels. Both login files stay
        # on the VM's own disk, not the mounted workspace, so the host never
        # sees them: the workspace path each agent reads is a link into the
        # VM's home.
        #
        # sbx places Claude's, and catches a /login inside the sandbox.
        # sbx/codex-mixin places Codex's only when a login is stored on the
        # host at create, so it's written here on every boot instead, matching
        # codex-config.toml. Without a host login, Codex fails to connect until
        # `sbx secret set openai --oauth` is run there; no rebuild needed.
        - command: |
            set -eu
            login() {
              vm="$1" ws="$2"
              mkdir -p "$(dirname "$vm")"
              chown agent:agent "$(dirname "$vm")"
              # An older layout of this kit kept the file in the workspace and
              # linked the VM's path to it; move it back.
              if [ -L "$vm" ]; then rm -f "$vm"; fi
              if [ -f "$ws" ] && [ ! -L "$ws" ]; then
                mv -f "$ws" "$vm"
                chown agent:agent "$vm"
              fi
              ln -sfn "$vm" "$ws"
              chown -h agent:agent "$ws"
            }
            login /home/agent/.claude/.credentials.json "$WORKSPACE_DIR/.sbx/claude/.credentials.json"
            login /home/agent/.codex/auth.json "$WORKSPACE_DIR/.sbx/codex/auth.json"
            printf '%s\n' '{ "OPENAI_API_KEY": "proxy-managed" }' > /home/agent/.codex/auth.json
            chown agent:agent /home/agent/.codex/auth.json
          user: "0"
          env: [WORKSPACE_DIR]
          description: Keep both agents' logins on the VM's own disk
